[project]
name = "leoruntime"
version = "0.1.0"
description = "LeoRuntime research project"
authors = [
    { name = "jucasoliveira", email = "jucas.oliveira@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mlflow>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
